name: Collecter et publier les annonces
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['backend/**', 'config/**', 'scripts/validate.py', '.github/workflows/collect.yml']
permissions:
  contents: read
concurrency:
  group: collect-pages
  cancel-in-progress: false
jobs:
  collect:
    if: github.event.repository.private == false && vars.COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests avant collecte
        run: python -m unittest discover -s tests -v
      - name: Collecte et normalisation
        run: python -m backend.generate
      - name: Valider les données publiques
        run: |
          python -m scripts.validate
          python -m scripts.check_secrets
      - name: Versionner les résultats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json public
          if ! git diff --cached --quiet; then
            git commit -m 'data: actualiser les annonces publiques'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
          retention-days: 1
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
