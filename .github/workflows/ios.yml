name: Compiler IPA iOS non signée
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios/**', 'scripts/build-ios.sh', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'scripts/build-ios.sh', '.github/workflows/ios.yml']
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
      - name: Tests Swift et archive arm64
        run: bash scripts/build-ios.sh
      - name: Artefact IPA
        uses: actions/upload-artifact@v4
        with:
          name: ImmoFlux-unsigned
          path: build/ImmoFlux-unsigned.ipa
          retention-days: 3
          if-no-files-found: error
